[project]
name = "ai-investment-analysis"
version = "0.1.0"
description = "全维度多Agent协作的AI投研助手系统"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    # Agent 框架
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",

    # 数据采集（auto-fallback 多源策略）
    "akshare>=1.14.0",
    "efinance>=0.5.5",
    "yfinance>=0.2.0",
    "tushare>=1.4.0",
    "baostock>=0.8.0",

    # 数据处理
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",                    # 技术指标库（纯Python，无需编译）

    # LLM
    "openai>=1.50.0",
    "json-repair>=0.30.0",

    # 数据库
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",               # PostgreSQL 异步驱动
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",        # PostgreSQL 同步驱动

    # 缓存
    "redis>=5.0.0",

    # 搜索引擎
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",

    # 配置 & 工具
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",

    # 调度
    "apscheduler>=3.10.0",

    # 通知
    "requests>=2.32.0",

    # 日志
    "loguru>=0.7.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
]

[project.scripts]
ai-invest = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
