# 信号权重配置
# 根据市场环境动态选择权重方案
# 8个Agent权重

market_regimes:
  bull:  # 牛市：趋势和资金更重要
    technical: 0.18
    fundamental: 0.08
    valuation: 0.08
    money_flow: 0.18
    sentiment: 0.13
    moat: 0.10
    business_model: 0.10
    industry: 0.15

  bear:  # 熊市：价值和护城河更重要
    technical: 0.10
    fundamental: 0.15
    valuation: 0.18
    money_flow: 0.08
    sentiment: 0.04
    moat: 0.18
    business_model: 0.15
    industry: 0.12

  neutral:  # 震荡：均衡配置
    technical: 0.12
    fundamental: 0.15
    valuation: 0.15
    money_flow: 0.10
    sentiment: 0.08
    moat: 0.15
    business_model: 0.13
    industry: 0.12

# 默认权重
default: neutral

# 硬性否决规则
veto_rules:
  - condition: is_st
    action: cap_score
    max_score: -50
    reason: "ST股票风险极高"

  - condition: is_delisting
    action: force_sell
    score: -100
    reason: "退市风险"

  - condition: is_suspended
    action: skip
    reason: "停牌中"

  - condition: ipo_days_lt_60
    action: skip
    reason: "次新股波动大，暂不分析"
