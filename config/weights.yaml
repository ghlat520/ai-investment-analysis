# 信号权重配置
# 根据市场环境动态选择权重方案
# 12个Agent权重（P3新增esg）

market_regimes:
  bull:  # 牛市：趋势和资金更重要，ESG权重适中
    technical: 0.11
    fundamental: 0.05
    valuation: 0.04
    money_flow: 0.11
    sentiment: 0.08
    moat: 0.05
    business_model: 0.05
    industry: 0.09
    supply_chain: 0.08
    competition: 0.11
    management: 0.13
    esg: 0.10  # P3新增：ESG在牛市关注可持续增长

  bear:  # 熊市：价值、护城河和ESG更重要（规避风险）
    technical: 0.05
    fundamental: 0.09
    valuation: 0.11
    money_flow: 0.04
    sentiment: 0.02
    moat: 0.11
    business_model: 0.09
    industry: 0.08
    supply_chain: 0.07
    competition: 0.09
    management: 0.14
    esg: 0.11  # P3新增：熊市ESG风险更重要

  neutral:  # 震荡：均衡配置
    technical: 0.07
    fundamental: 0.09
    valuation: 0.09
    money_flow: 0.05
    sentiment: 0.04
    moat: 0.09
    business_model: 0.08
    industry: 0.08
    supply_chain: 0.08
    competition: 0.10
    management: 0.12
    esg: 0.11  # P3新增：ESG作为长期价值评估维度

  # R3: 价值投资权重方案
  value_investing:
    # 第一梯队：价值投资核心（代码主导，高可靠性）
    fundamental: 0.18     # 盈利能力、财务健康是基石
    valuation: 0.18       # 估值是否合理是价值投资的灵魂
    moat: 0.15            # 持续竞争优势（巴菲特第一原则）

    # 第二梯队：企业质量评估（LLM+代码锚点）
    business_model: 0.12  # 理解赚钱逻辑
    management: 0.08      # 管理层重要但LLM评估信噪比有限
    industry: 0.08        # 行业格局影响长期价值

    # 第三梯队：辅助维度
    competition: 0.06     # 可与moat互补
    supply_chain: 0.04    # 供应链作为风险因子
    esg: 0.04             # ESG作为长期风险因子

    # 第四梯队：择时参考（不影响"是否值得买"，仅影响"何时买"）
    sentiment: 0.03       # 可作为逆向指标
    technical: 0.02       # 仅帮助择时
    money_flow: 0.02      # 仅帮助择时

# 默认权重
default: value_investing

# R3: 融合比例配置（代码/LLM权重）
fusion_ratios:
  # 量化优先Agent: 代码计算可靠，LLM仅微调
  code_dominant:
    agents: [fundamental, valuation, technical, money_flow]
    code_weight: 0.7
    llm_weight: 0.3

  # 定性为主Agent: LLM提供主要判断
  llm_dominant:
    agents: [moat, business_model, industry, supply_chain, competition, management, esg, sentiment]
    code_weight: 0.3
    llm_weight: 0.7

  # 融合辩论层
  fusion:
    code_weight: 0.5
    llm_weight: 0.5

# 择时因子列表（不影响价值判断，仅影响timing_signal）
timing_agents: [technical, money_flow, sentiment]

# 硬性否决规则
veto_rules:
  - condition: is_st
    action: cap_score
    max_score: -50
    reason: "ST股票风险极高"

  - condition: is_delisting
    action: force_sell
    score: -100
    reason: "退市风险"

  - condition: is_suspended
    action: skip
    reason: "停牌中"

  - condition: ipo_days_lt_60
    action: skip
    reason: "次新股波动大，暂不分析"

  # 管理层风险否决规则
  - condition: management_red_flag
    action: cap_score
    max_score: -30
    reason: "管理层存在重大风险信号（如财务造假、大额减持等）"

  # P3新增：ESG重大风险否决规则
  - condition: esg_critical_risk
    action: cap_score
    max_score: -40
    reason: "ESG存在重大风险（如重大环保处罚、安全生产事故等）"
