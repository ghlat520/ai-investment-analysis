# 信号权重配置
# 根据市场环境动态选择权重方案
# 9个Agent权重

market_regimes:
  bull:  # 牛市：趋势和资金更重要
    technical: 0.16
    fundamental: 0.07
    valuation: 0.07
    money_flow: 0.16
    sentiment: 0.12
    moat: 0.08
    business_model: 0.08
    industry: 0.14
    supply_chain: 0.12

  bear:  # 熊市：价值和护城河更重要
    technical: 0.08
    fundamental: 0.14
    valuation: 0.16
    money_flow: 0.07
    sentiment: 0.04
    moat: 0.16
    business_model: 0.14
    industry: 0.11
    supply_chain: 0.10

  neutral:  # 震荡：均衡配置
    technical: 0.10
    fundamental: 0.14
    valuation: 0.14
    money_flow: 0.08
    sentiment: 0.07
    moat: 0.13
    business_model: 0.12
    industry: 0.11
    supply_chain: 0.11

# 默认权重
default: neutral

# 硬性否决规则
veto_rules:
  - condition: is_st
    action: cap_score
    max_score: -50
    reason: "ST股票风险极高"

  - condition: is_delisting
    action: force_sell
    score: -100
    reason: "退市风险"

  - condition: is_suspended
    action: skip
    reason: "停牌中"

  - condition: ipo_days_lt_60
    action: skip
    reason: "次新股波动大，暂不分析"
