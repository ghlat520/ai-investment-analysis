# Agent 配置
# 每个Agent可独立配置：模型、开关、参数
# llm_mode: "enhance" (代码优先+LLM微调) 或 "primary" (LLM做主角)
# llm_score_range: LLM评分调整范围（enhance模式下的±N）
#
# llm_provider 支持: ollama / openai / anthropic
# ollama 使用本地模型（免费），适合开发/测试
# openai/anthropic 使用云端 API（付费），适合生产环境

agents:
  technical:
    enabled: true
    display_name: "技术面分析"
    llm_provider: ollama
    llm_model: qwen2.5:14b
    temperature: 0.2
    max_tokens: 2000
    timeout: 120
    prompt_template: prompts/technical.md
    llm_mode: enhance
    llm_score_range: 15

  fundamental:
    enabled: true
    display_name: "基本面分析"
    llm_provider: ollama
