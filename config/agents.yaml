# Agent 配置
# llm_provider/llm_model 省略时使用 .env 中的全局默认值
# 切换模型只需改 .env: LLM_DEFAULT_PROVIDER + {PROVIDER}_DEFAULT_MODEL
#
# llm_mode: "enhance" (代码优先+LLM微调) 或 "primary" (LLM做主角)
# llm_score_range: LLM评分调整范围（enhance模式下的±N）

agents:
  technical:
    enabled: true
    display_name: "技术面分析"
    temperature: 0.2
    max_tokens: 2000
    timeout: 120
    prompt_template: prompts/technical.md
    llm_mode: enhance
    llm_score_range: 15

  fundamental:
    enabled: true
    display_name: "基本面分析"
    temperature: 0.3
    max_tokens: 4000
    timeout: 180
    prompt_template: prompts/fundamental.md
    llm_mode: enhance
    llm_score_range: 40

